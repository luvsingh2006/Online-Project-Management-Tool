# Application Configuration
app.name=Online Project Management Tool
app.version=1.0.0
app.env=production
server.port=8080
server.host=0.0.0.0
server.contextPath=/

# Database Configuration (Pure JDBC)
db.driver=com.pmtool.db.embedded.EmbeddedJdbcDriver
db.url=jdbc:embedded:data/pmtool.db
db.username=admin
db.password=pmtool_secure_pass

# Connection Pool Settings
db.pool.initialSize=5
db.pool.maxSize=20
db.pool.maxWaitMillis=5000
db.pool.idleTimeoutMillis=300000

# Security and Session
auth.session.timeoutMinutes=120
auth.session.cookieName=PMTOOL_SESSION_ID
auth.token.secret=pmtool-enterprise-jwt-and-session-salt-2026

# Concurrency & Background Workers
worker.pool.coreThreads=4
worker.pool.maxThreads=8
worker.pool.queueCapacity=500
